<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projekt – Gian-Andri Vonzun</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <script src="../js/projects-data.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary:#fafafa; --bg-secondary:#ffffff; --bg-card:#ffffff;
      --border:rgba(15,23,42,0.08);
      --accent1:#0d9488; --accent2:#0f766e; --accent3:#14b8a6;
      --text:#0f172a; --text-muted:#64748b;
      --nav-bg:rgba(255,255,255,0.8);
      --radius:16px; --radius-lg:24px;
    }
    [data-theme="dark"] {
      --bg-primary:#0a0a14; --bg-secondary:#10101e; --bg-card:#17172a;
      --border:rgba(255,255,255,0.10);
      --text:#f1f5f9; --text-muted:#9aa3b2;
      --nav-bg:rgba(10,10,20,0.8);
    }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Inter',sans-serif; background:var(--bg-primary); color:var(--text);
      line-height:1.65; overflow-x:hidden; transition:background-color .3s,color .3s;
    }
    a { color:var(--accent1); text-decoration:none; transition:color .2s; }
    a:hover { color:var(--accent2); }

    .bg-glow {
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(600px circle at 10% -10%, rgba(13,148,136,0.08), transparent 50%),
        radial-gradient(500px circle at 90% 10%, rgba(15,118,110,0.06), transparent 50%);
    }

    body > nav {
      position:fixed; top:0; left:0; right:0; z-index:100; height:64px;
      display:flex; align-items:center; justify-content:space-between; padding:0 2rem;
      background:var(--nav-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
    }
    .nav-logo { font-family:'Poppins',sans-serif; font-weight:700; font-size:1.05rem; color:var(--text); }
    .nav-right { display:flex; align-items:center; gap:.8rem; }
    .nav-back {
      display:inline-flex; align-items:center; gap:.5rem; padding:.5rem 1rem; border-radius:10px;
      background:var(--bg-card); border:1px solid var(--border); color:var(--text); font-size:.85rem;
      transition:transform .2s,border-color .2s,background .2s;
    }
    .nav-back:hover { transform:translateX(-3px); border-color:var(--accent1); background:rgba(13,148,136,0.06); color:var(--accent1); }
    .theme-toggle {
      width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:transparent;
      color:var(--text-muted); cursor:pointer; display:flex; align-items:center; justify-content:center;
      font-size:.95rem; transition:all .2s;
    }
    .theme-toggle:hover { color:var(--accent1); border-color:var(--accent1); transform:rotate(12deg); }

    main { position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:7rem 2rem 6rem; }

    .p-header {
      display:grid; grid-template-columns:auto 1fr; gap:1.5rem; align-items:center;
      padding:2rem; border-radius:var(--radius-lg);
      background:linear-gradient(135deg, rgba(13,148,136,0.06), rgba(15,118,110,0.03));
      border:1px solid var(--border); margin-bottom:2rem; position:relative; overflow:hidden;
    }
    .p-icon {
      width:84px; height:84px; border-radius:20px; display:grid; place-items:center; font-size:2.3rem;
      background:rgba(13,148,136,0.14); color:var(--accent1); border:1px solid rgba(13,148,136,0.3); flex-shrink:0;
    }
    .p-title { font-family:'Poppins',sans-serif; font-size:clamp(1.5rem,3.4vw,2.3rem); font-weight:800; letter-spacing:-.5px; line-height:1.12; margin-bottom:.4rem; }
    .p-tagline { color:var(--text-muted); font-size:1.05rem; }
    .p-chips { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1.1rem; }
    .chip {
      display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .75rem; border-radius:99px;
      font-size:.78rem; background:var(--bg-card); border:1px solid var(--border); color:var(--text-muted);
    }
    .chip .status-dot { width:8px; height:8px; border-radius:50%; }
    .dot-done{background:#22c55e;box-shadow:0 0 8px #22c55e;} .dot-active{background:var(--accent1);box-shadow:0 0 8px var(--accent1);}

    /* Screenshots */
    .shots { display:grid; gap:1rem; margin-bottom:2rem; }
    .shots img { width:100%; border-radius:var(--radius); border:1px solid var(--border); display:block; box-shadow:0 8px 24px rgba(15,23,42,0.10); }
    .shot-placeholder {
      border:1px dashed var(--border); border-radius:var(--radius); padding:3rem 1.5rem; text-align:center;
      color:var(--text-muted); background:var(--bg-card);
    }
    .shot-placeholder i { font-size:1.8rem; color:var(--accent1); margin-bottom:.6rem; display:block; }

    .p-grid { display:grid; grid-template-columns:2fr 1fr; gap:2rem; }
    @media (max-width:820px){ .p-grid{grid-template-columns:1fr;} .p-header{grid-template-columns:1fr;} }

    .card {
      background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
      padding:1.5rem 1.6rem; margin-bottom:1.25rem;
    }
    .card h2 { font-family:'Poppins',sans-serif; font-size:1.05rem; font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:.6rem; }
    .card h2 i { color:var(--accent1); font-size:.95rem; }
    .card p { color:var(--text-muted); font-size:.95rem; }

    ul.list-check { list-style:none; display:flex; flex-direction:column; gap:.6rem; }
    ul.list-check li { display:flex; gap:.7rem; font-size:.93rem; color:var(--text); }
    ul.list-check li::before { content:'\f00c'; font-family:'Font Awesome 6 Free'; font-weight:900; color:var(--accent1); flex-shrink:0; font-size:.8rem; margin-top:.15rem; }

    .tags { display:flex; flex-wrap:wrap; gap:.4rem; }
    .tag { padding:.3rem .7rem; border-radius:99px; background:rgba(13,148,136,0.10); border:1px solid rgba(13,148,136,0.25); color:var(--accent1); font-size:.78rem; font-weight:600; }

    .info-row { display:flex; justify-content:space-between; padding:.6rem 0; border-bottom:1px solid var(--border); font-size:.88rem; }
    .info-row:last-child { border-bottom:none; }
    .info-row .k { color:var(--text-muted); } .info-row .v { color:var(--text); font-weight:600; text-align:right; }

    .reflection { border-left:3px solid var(--accent1); padding:.4rem 0 .4rem 1rem; font-style:italic; color:var(--text); font-size:.95rem; }

    .btn-row { display:flex; flex-direction:column; gap:.6rem; }
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:.5rem; padding:.7rem 1rem;
      border-radius:10px; font-weight:600; font-size:.88rem; border:1px solid var(--border);
    }
    .btn-primary { background:var(--accent1); color:#fff; border-color:var(--accent1); }
    .btn-primary:hover { color:#fff; opacity:.9; }
    .btn-ghost { background:transparent; color:var(--text); }
    .btn-ghost:hover { border-color:var(--accent1); color:var(--accent1); }
    .muted-note { font-size:.85rem; color:var(--text-muted); }

    .p-nav { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:2.5rem; }
    .p-nav a { display:block; padding:1rem 1.2rem; border-radius:var(--radius); background:var(--bg-card); border:1px solid var(--border); color:var(--text); transition:transform .2s,border-color .2s,background .2s; }
    .p-nav a:hover { border-color:var(--accent1); background:rgba(13,148,136,0.04); transform:translateY(-2px); }
    .p-nav .label { color:var(--text-muted); font-size:.72rem; text-transform:uppercase; letter-spacing:1px; margin-bottom:.3rem; }
    .p-nav .ttl { font-weight:700; font-size:.92rem; }
    .p-nav a.next { text-align:right; }
    .p-nav a.disabled { opacity:.3; pointer-events:none; }

    .err { text-align:center; padding:5rem 2rem; }
    .fade-in { opacity:0; transform:translateY(18px); animation:fi .6s ease forwards; }
    .fade-in.d1{animation-delay:.1s;} .fade-in.d2{animation-delay:.2s;} .fade-in.d3{animation-delay:.3s;}
    @keyframes fi { to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <nav>
    <a href="../index.html" class="nav-logo">Gian-Andri Vonzun</a>
    <div class="nav-right">
      <button class="theme-toggle" id="theme-toggle" aria-label="Design wechseln" title="Design wechseln"><i class="fas fa-moon"></i></button>
      <a href="../index.html#projects" class="nav-back"><i class="fas fa-arrow-left"></i> Zurück zu den Projekten</a>
    </div>
  </nav>

  <main id="main"></main>

  <script>
    // ===== Theme (gleich wie Hauptseite) =====
    (function(){
      const root=document.documentElement, btn=document.getElementById('theme-toggle'), icon=btn.querySelector('i');
      function apply(t){ if(t==='dark'){root.setAttribute('data-theme','dark');icon.className='fas fa-sun';}else{root.removeAttribute('data-theme');icon.className='fas fa-moon';} }
      const saved=localStorage.getItem('theme');
      const prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
      apply(saved||(prefersDark?'dark':'light'));
      btn.addEventListener('click',()=>{ const n=root.getAttribute('data-theme')==='dark'?'light':'dark'; localStorage.setItem('theme',n); apply(n); });
    })();

    // ===== Detail rendern =====
    const id = new URLSearchParams(location.search).get('id');
    const main = document.getElementById('main');
    const list = projects.filter(p => p.detail);            // nur Projekte mit Detailseite
    const idx = list.findIndex(p => p.id === id);
    const p = idx >= 0 ? list[idx] : null;

    if (!p) {
      main.innerHTML = `<div class="err"><h1>Projekt nicht gefunden</h1>
        <p style="margin-top:1rem"><a href="../index.html#projects">← Zurück zur Übersicht</a></p></div>`;
    } else {
      const d = p.detail;
      document.title = `${p.title} · Gian-Andri Vonzun`;
      const prev = list[idx-1], next = list[idx+1];
      const typeLabel = p.type === 'privat' ? '<i class="fas fa-user"></i> Privates Projekt' : '<i class="fas fa-graduation-cap"></i> Schulprojekt';

      // Screenshots oder Platzhalter
      const shots = (d.shots && d.shots.length)
        ? `<div class="shots fade-in">${d.shots.map(f => `<img src="../images/projects/${f}" alt="${p.title} Screenshot" loading="lazy">`).join('')}</div>`
        : `<div class="shots fade-in"><div class="shot-placeholder"><i class="fas fa-image"></i>Screenshots folgen in Kürze</div></div>`;

      // Links
      const links = [];
      if (d.links && d.links.live)   links.push(`<a class="btn btn-primary" href="${d.links.live}" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i> Live ansehen</a>`);
      if (d.links && d.links.github) links.push(`<a class="btn btn-ghost" href="${d.links.github}" target="_blank" rel="noopener"><i class="fab fa-github"></i> Quellcode</a>`);
      const linksCard = links.length
        ? `<div class="card fade-in d3"><h2><i class="fas fa-link"></i> Links</h2><div class="btn-row">${links.join('')}</div></div>`
        : `<div class="card fade-in d3"><h2><i class="fas fa-link"></i> Links</h2><p class="muted-note">Quellcode &amp; Demo auf Anfrage – sprich mich gerne darauf an.</p></div>`;

      main.innerHTML = `
        <header class="p-header fade-in">
          <div class="p-icon">${p.emoji}</div>
          <div>
            <h1 class="p-title">${p.title}</h1>
            <p class="p-tagline">${d.tagline}</p>
            <div class="p-chips">
              <span class="chip">${typeLabel}</span>
              <span class="chip"><i class="fas fa-folder"></i> ${p.category}</span>
              <span class="chip"><span class="status-dot ${d.status==='Abgeschlossen'?'dot-done':'dot-active'}"></span> ${d.status}</span>
            </div>
          </div>
        </header>

        ${shots}

        <div class="p-grid">
          <div>
            <div class="card fade-in d1">
              <h2><i class="fas fa-circle-info"></i> Über das Projekt</h2>
              <p>${d.intro}</p>
            </div>
            <div class="card fade-in d2">
              <h2><i class="fas fa-list-check"></i> Funktionen &amp; Highlights</h2>
              <ul class="list-check">${d.features.map(f => `<li>${f}</li>`).join('')}</ul>
            </div>
            <div class="card fade-in d3">
              <h2><i class="fas fa-lightbulb"></i> Was ich dabei gelernt habe</h2>
              <p class="reflection">${d.learned}</p>
            </div>
          </div>

          <aside>
            <div class="card fade-in d1">
              <h2><i class="fas fa-circle-info"></i> Fakten</h2>
              <div class="info-row"><span class="k">Rolle</span><span class="v">${d.role}</span></div>
              <div class="info-row"><span class="k">Status</span><span class="v">${d.status}</span></div>
              <div class="info-row"><span class="k">Jahr</span><span class="v">${p.year}</span></div>
              <div class="info-row"><span class="k">Typ</span><span class="v">${p.type==='privat'?'Privat':'Schule'}</span></div>
            </div>
            <div class="card fade-in d2">
              <h2><i class="fas fa-microchip"></i> Technologien</h2>
              <div class="tags">${p.techs.map(t => `<span class="tag">${t}</span>`).join('')}</div>
            </div>
            ${linksCard}
          </aside>
        </div>

        <nav class="p-nav">
          ${prev
            ? `<a href="?id=${prev.id}" class="prev"><div class="label"><i class="fas fa-arrow-left"></i> Vorheriges</div><div class="ttl">${prev.title}</div></a>`
            : `<a class="disabled"><div class="label">–</div><div class="ttl">Erstes Projekt</div></a>`}
          ${next
            ? `<a href="?id=${next.id}" class="next"><div class="label">Nächstes <i class="fas fa-arrow-right"></i></div><div class="ttl">${next.title}</div></a>`
            : `<a class="disabled next"><div class="label">–</div><div class="ttl">Letztes Projekt</div></a>`}
        </nav>
      `;
    }
  </script>
</body>
</html>
