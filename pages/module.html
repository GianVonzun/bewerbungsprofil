<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modul – E-Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary:   #fafafa;
      --bg-secondary: #ffffff;
      --bg-card:      #ffffff;
      --border:       rgba(15,23,42,0.08);
      --accent1:      #0d9488;
      --accent2:      #0f766e;
      --accent3:      #db2777;
      --text:         #0f172a;
      --text-muted:   #64748b;
      --radius:       16px;
      --radius-lg:    24px;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text);
      line-height: 1.65;
      overflow-x: hidden;
    }
    a { color: var(--accent2); text-decoration: none; transition: color 0.2s; }
    a:hover { color: var(--accent3); }

    /* Decorative background */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(600px circle at 10% -10%, rgba(13,148,136,0.08), transparent 50%),
        radial-gradient(500px circle at 90% 10%, rgba(15,118,110,0.06), transparent 50%);
    }

    /* Top bar */
    body > nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .nav-back {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 99px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.85rem;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }
    .nav-back:hover {
      transform: translateX(-3px);
      border-color: rgba(13,148,136,0.4);
      background: rgba(13,148,136,0.06);
      color: var(--accent1);
    }

    /* Layout */
    main {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 7rem 2rem 6rem;
    }

    /* Header block */
    .m-header {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1.5rem;
      align-items: center;
      padding: 2rem;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(13,148,136,0.05), rgba(15,118,110,0.03));
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(15,23,42,0.04);
      margin-bottom: 2.5rem;
      position: relative;
      overflow: hidden;
    }
    .m-header::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(13,148,136,0.12), transparent 70%);
      transform: translate(30%, -30%);
      pointer-events: none;
    }
    .m-icon {
      width: 84px; height: 84px;
      border-radius: 20px;
      display: grid; place-items: center;
      font-size: 2.5rem;
      background: rgba(13,148,136,0.15);
      border: 1px solid rgba(13,148,136,0.3);
      flex-shrink: 0;
    }
    .icon-purple { background: rgba(13,148,136,0.15); color: #2dd4bf; border-color: rgba(13,148,136,0.3); }
    .icon-cyan   { background: rgba(15,118,110,0.15);  color: #5eead4; border-color: rgba(15,118,110,0.3); }
    .icon-pink   { background: rgba(244,114,182,0.15);color: #f472b6; border-color: rgba(244,114,182,0.3); }
    .icon-green  { background: rgba(34,197,94,0.15);  color: #4ade80; border-color: rgba(34,197,94,0.3); }
    .icon-orange { background: rgba(249,115,22,0.15); color: #fb923c; border-color: rgba(249,115,22,0.3); }
    .icon-yellow { background: rgba(234,179,8,0.15);  color: #facc15; border-color: rgba(234,179,8,0.3); }

    .m-head-text { min-width: 0; }
    .m-number {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      padding: 0.25rem 0.65rem;
      border-radius: 99px;
      background: rgba(255,255,255,0.06);
      color: var(--accent2);
      letter-spacing: 1px;
      margin-bottom: 0.6rem;
    }
    .m-title {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(1.4rem, 3.2vw, 2.2rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }
    .m-desc {
      color: var(--text-muted);
      font-size: 1.02rem;
    }

    /* Status chips */
    .m-chips {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      margin-top: 1.2rem;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: 99px;
      font-size: 0.78rem;
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .chip.status { color: var(--text); }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .dot-done { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
    .dot-active { background: #5eead4; box-shadow: 0 0 8px #5eead4; animation: pulse 2s infinite; }
    .dot-upcoming { background: #94a3b8; }
    @keyframes pulse { 50% { opacity: 0.4; } }

    /* Two-col grid */
    .m-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 780px) {
      .m-grid { grid-template-columns: 1fr; }
      .m-header { grid-template-columns: 1fr; text-align: left; }
    }

    /* Section cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem 1.6rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 2px 8px rgba(15,23,42,0.04);
      transition: box-shadow 0.25s, transform 0.25s;
    }
    .card:hover {
      box-shadow: 0 8px 24px rgba(15,23,42,0.08);
      transform: translateY(-2px);
    }
    .card h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex; align-items: center; gap: 0.6rem;
      color: var(--text);
    }
    .card h2 i {
      color: var(--accent2);
      font-size: 0.95rem;
    }
    .card p { color: var(--text-muted); font-size: 0.95rem; }

    /* Lists */
    ul.list-check, ul.list-dot {
      list-style: none;
      display: flex; flex-direction: column;
      gap: 0.6rem;
    }
    ul.list-check li {
      display: flex; gap: 0.7rem;
      font-size: 0.92rem;
      color: var(--text);
      padding-left: 0;
    }
    ul.list-check li::before {
      content: '✓';
      color: #4ade80;
      font-weight: 700;
      flex-shrink: 0;
    }
    ul.list-dot li {
      padding-left: 1rem;
      position: relative;
      font-size: 0.92rem;
      color: var(--text);
    }
    ul.list-dot li::before {
      content: '';
      position: absolute;
      left: 0; top: 0.55em;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
    }

    /* Tag pills */
    .tags {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
    }
    .tag {
      padding: 0.3rem 0.7rem;
      border-radius: 99px;
      background: rgba(13,148,136,0.08);
      border: 1px solid rgba(13,148,136,0.2);
      color: #0f766e;
      font-size: 0.78rem;
      font-weight: 500;
    }

    /* Info rows */
    .info-row {
      display: flex; justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(15,23,42,0.06);
      font-size: 0.88rem;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .k { color: var(--text-muted); }
    .info-row .v { color: var(--text); font-weight: 600; text-align: right; }

    /* Reflection quote */
    .reflection {
      border-left: 3px solid var(--accent2);
      padding: 0.5rem 0 0.5rem 1rem;
      font-style: italic;
      color: var(--text);
      font-size: 0.95rem;
    }

    /* Prev / next navigation */
    .m-nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 2.5rem;
    }
    .m-nav a {
      display: block;
      padding: 1rem 1.2rem;
      border-radius: var(--radius);
      background: var(--bg-card);
      border: 1px solid var(--border);
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
      color: var(--text);
    }
    .m-nav a {
      box-shadow: 0 2px 8px rgba(15,23,42,0.04);
    }
    .m-nav a:hover {
      border-color: rgba(13,148,136,0.3);
      background: rgba(13,148,136,0.04);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15,23,42,0.08);
    }
    .m-nav .label {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.3rem;
    }
    .m-nav .ttl {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .m-nav a.next { text-align: right; }
    .m-nav a.disabled {
      opacity: 0.3; pointer-events: none;
    }

    /* 404 */
    .err {
      text-align: center;
      padding: 5rem 2rem;
    }
    .err h1 { font-size: 2rem; margin-bottom: 1rem; }

    /* Fade-in animation */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: fi 0.7s ease forwards;
    }
    .fade-in.d1 { animation-delay: 0.1s; }
    .fade-in.d2 { animation-delay: 0.2s; }
    .fade-in.d3 { animation-delay: 0.3s; }
    .fade-in.d4 { animation-delay: 0.4s; }
    @keyframes fi {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <nav>
    <a href="../index.html" class="nav-logo">&lt;GV /&gt;</a>
    <a href="../index.html#modules" class="nav-back">
      <i class="fas fa-arrow-left"></i> Zurück zu den Modulen
    </a>
  </nav>

  <main id="main"></main>

  <script src="../js/modules-data.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const main = document.getElementById('main');

    const statusLabel = {
      done: 'Abgeschlossen',
      active: 'Laufend',
      upcoming: 'Geplant'
    };

    const idx = modules.findIndex(m => m.number === id);
    const m = idx >= 0 ? modules[idx] : null;

    if (!m) {
      main.innerHTML = `
        <div class="err">
          <h1>Modul nicht gefunden</h1>
          <p>Das Modul mit der ID <strong>${id || '–'}</strong> existiert nicht.</p>
          <p style="margin-top:1.5rem"><a href="../index.html#modules">← Zurück zur Übersicht</a></p>
        </div>`;
    } else {
      document.title = `${m.number} – ${m.title} · E-Portfolio`;
      const d = m.detail || {};
      const prev = modules[idx - 1];
      const next = modules[idx + 1];

      main.innerHTML = `
        <header class="m-header fade-in">
          <div class="m-icon ${m.iconClass}">${m.icon}</div>
          <div class="m-head-text">
            <span class="m-number">${m.number}</span>
            <h1 class="m-title">${m.title}</h1>
            <p class="m-desc">${m.desc}</p>
            <div class="m-chips">
              <span class="chip status">
                <span class="status-dot dot-${m.status}"></span>
                ${statusLabel[m.status] || m.status}
              </span>
              <span class="chip"><i class="fas fa-folder"></i> ${m.category}</span>
              ${d.duration ? `<span class="chip"><i class="fas fa-clock"></i> ${d.duration}</span>` : ''}
            </div>
          </div>
        </header>

        <div class="m-grid">
          <!-- Left -->
          <div>
            <div class="card fade-in d1">
              <h2><i class="fas fa-book-open"></i> Worum geht's?</h2>
              <p>${d.intro || m.desc}</p>
            </div>

            <div class="card fade-in d2">
              <h2><i class="fas fa-bullseye"></i> Lernziele</h2>
              <ul class="list-check">
                ${(d.goals || m.topics).map(g => `<li>${g}</li>`).join('')}
              </ul>
            </div>

            <div class="card fade-in d3">
              <h2><i class="fas fa-list-ul"></i> Themenbereiche</h2>
              <ul class="list-dot">
                ${m.topics.map(t => `<li>${t}</li>`).join('')}
              </ul>
            </div>

            ${d.reflection ? `
            <div class="card fade-in d4">
              <h2><i class="fas fa-comment-dots"></i> Meine Reflexion</h2>
              <p class="reflection">„${d.reflection}"</p>
            </div>` : ''}
          </div>

          <!-- Right sidebar -->
          <aside>
            <div class="card fade-in d1">
              <h2><i class="fas fa-info-circle"></i> Fakten</h2>
              <div class="info-row"><span class="k">Modul</span><span class="v">${m.number}</span></div>
              <div class="info-row"><span class="k">Status</span><span class="v">${statusLabel[m.status]}</span></div>
              ${d.duration ? `<div class="info-row"><span class="k">Dauer</span><span class="v">${d.duration}</span></div>` : ''}
              ${d.assessment ? `<div class="info-row"><span class="k">Bewertung</span><span class="v">${d.assessment}</span></div>` : ''}
              <div class="info-row"><span class="k">Bereich</span><span class="v" style="text-transform:capitalize">${m.category.replace('-', ' ')}</span></div>
            </div>

            <div class="card fade-in d2">
              <h2><i class="fas fa-tools"></i> Tools</h2>
              <div class="tags">
                ${m.tools.map(t => `<span class="tag">${t}</span>`).join('')}
              </div>
            </div>

            <div class="card fade-in d3">
              <h2><i class="fas fa-hashtag"></i> Tags</h2>
              <div class="tags">
                ${m.tags.map(t => `<span class="tag">${t}</span>`).join('')}
              </div>
            </div>

            ${d.projects && d.projects.length ? `
            <div class="card fade-in d4">
              <h2><i class="fas fa-rocket"></i> Projekte</h2>
              <ul class="list-dot">
                ${d.projects.map(p => `<li>${p}</li>`).join('')}
              </ul>
            </div>` : ''}
          </aside>
        </div>

        <nav class="m-nav">
          ${prev
            ? `<a href="?id=${prev.number}" class="prev">
                 <div class="label"><i class="fas fa-arrow-left"></i> Vorheriges Modul</div>
                 <div class="ttl">${prev.number} · ${prev.title}</div>
               </a>`
            : `<a class="disabled"><div class="label">–</div><div class="ttl">Erstes Modul</div></a>`}
          ${next
            ? `<a href="?id=${next.number}" class="next">
                 <div class="label">Nächstes Modul <i class="fas fa-arrow-right"></i></div>
                 <div class="ttl">${next.number} · ${next.title}</div>
               </a>`
            : `<a class="disabled next"><div class="label">–</div><div class="ttl">Letztes Modul</div></a>`}
        </nav>
      `;
    }
  </script>
</body>
</html>
